name: CI

on:
  push:
    branches: [main, devsecops]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # v0 : python-version: "3.10"
          # Même version que l'image de production (python:3.13-slim) : on teste ce qu'on déploie
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install semgrep==1.178.0

      - name: Analyse Semgrep (échec si alerte)
        run: semgrep scan --config p/python --metrics=off --error --sarif --output semgrep.sarif

      - name: Envoi vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tout l'historique : un secret supprimé reste dans les anciens commits
          fetch-depth: 0

      - name: Installation de Gitleaks (binaire officiel, empreinte vérifiée)
        run: |
          V=$GITLEAKS_VERSION
          B=https://github.com/gitleaks/gitleaks/releases/download/v$V
          curl -sSLO $B/gitleaks_${V}_linux_x64.tar.gz
          curl -sSLO $B/gitleaks_${V}_checksums.txt
          sha256sum --check --ignore-missing gitleaks_${V}_checksums.txt
          tar -xzf gitleaks_${V}_linux_x64.tar.gz gitleaks

      - name: Recherche de secrets dans l'historique (échec si secret)
        run: ./gitleaks git --redact -v --report-format sarif --report-path gitleaks.sarif .

      - name: Envoi vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  deps:
    name: Dépendances (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1

      - name: Audit des dépendances (échec si vulnérabilité connue)
        run: pip-audit -r requirements.txt

  build-and-scan:
    # v0 : needs: test
    # L'image n'est construite que si tous les contrôles du code passent
    needs: [test, sast, secrets, deps]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build de l'image
        run: docker build -t monapi:${{ github.sha }} .

      - name: Scan Trivy (rapport SARIF HIGH + CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: monapi:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Envoi vers l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Barrière de sécurité (échec si CRITICAL corrigeable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: monapi:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dast:
    name: DAST (OWASP ZAP)
    # Ne teste l'application en fonctionnement que si l'image a passé Trivy
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build de l'image
        run: docker build -t monapi:${{ github.sha }} .

      - name: Démarrage de l'API (mêmes protections que dans le cluster)
        run: |
          docker run -d --name monapi --read-only \
            --tmpfs /tmp \
            --tmpfs /app/data:uid=10001,gid=10001 \
            --tmpfs /home/appuser:uid=10001,gid=10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 5000:5000 monapi:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/health && exit 0
            sleep 1
          done
          docker logs monapi
          exit 1

      - name: Scan ZAP de l'API (description OpenAPI + règles .zap/rules.tsv)
        run: |
          mkdir zap
          cp openapi.yaml .zap/rules.tsv zap/
          chmod -R a+rw zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            zaproxy/zap-stable:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi \
            -O http://localhost:5000 -c rules.tsv \
            -r zap-report.html -J zap-report.json

      - name: Publication du rapport ZAP (artefact)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-report
          path: zap/zap-report.*
