# Interdit les conteneurs qui tournent en root, en mode privilégié
# ou qui peuvent élever leurs privilèges.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/title: Conteneurs non-root et non privilégiés
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kyverno, local-path-storage]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: podRunAsNonRoot
      expression: >-
        has(object.spec.securityContext)
        && has(object.spec.securityContext.runAsNonRoot)
        && object.spec.securityContext.runAsNonRoot == true
  validations:
    - expression: >-
        variables.containers.all(c,
          has(c.securityContext) && has(c.securityContext.runAsNonRoot)
            ? c.securityContext.runAsNonRoot == true
            : variables.podRunAsNonRoot)
      message: >-
        Les conteneurs doivent tourner sans être root :
        définir securityContext.runAsNonRoot: true.
    - expression: >-
        variables.containers.all(c,
          !has(c.securityContext) || !has(c.securityContext.privileged)
          || c.securityContext.privileged == false)
      message: Les conteneurs privilégiés sont interdits (securityContext.privileged).
    - expression: >-
        variables.containers.all(c,
          has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation)
          && c.securityContext.allowPrivilegeEscalation == false)
      message: >-
        L'élévation de privilèges doit être désactivée :
        définir securityContext.allowPrivilegeEscalation: false.
