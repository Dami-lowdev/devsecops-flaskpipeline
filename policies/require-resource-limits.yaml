# Impose des requests et des limits CPU et mémoire à chaque conteneur,
# pour qu'un pod ne puisse pas épuiser les ressources du nœud.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Requests et limits CPU/mémoire obligatoires
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kyverno, local-path-storage]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.resources) && has(c.resources.requests) && has(c.resources.limits)
          && 'cpu' in c.resources.requests && 'memory' in c.resources.requests
          && 'cpu' in c.resources.limits && 'memory' in c.resources.limits)
      message: >-
        Chaque conteneur doit définir resources.requests et resources.limits
        pour le CPU et la mémoire.
